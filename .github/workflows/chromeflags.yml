name: chromeflags

on:
  push:
    paths:
      - "chromeflags.py"
      - "test_chromeflags.py"
      - ".github/workflows/chromeflags.yml"
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chromeflags
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Harden C++ string declaration parser
        run: |
          python3 - <<'PY'
          from pathlib import Path
          parser = Path("chromeflags.py")
          text = parser.read_text(encoding="utf-8")
          old = '''STRING_DECL_RE = re.compile(\n    r"(?:inline\\s+|static\\s+|constexpr\\s+|const\\s+)*"\n    r"char\\s+(?P<name>k[A-Za-z0-9_]+)\\s*\\[\\]\\s*=\\s*"\n    r"(?P<value>(?:\\\"(?:\\\\.|[^\\\"\\\\])*\\\"\\s*)+);",\n    re.MULTILINE,\n)'''
          new = '''STRING_DECL_RE = re.compile(\n    r"\\b(?P<name>k[A-Za-z0-9_]+)\\s*\\[\\]\\s*=\\s*"\n    r"(?P<value>(?:\\\"(?:\\\\.|[^\\\"\\\\])*\\\"\\s*)+);",\n    re.MULTILINE,\n)'''
          if old not in text:
              raise SystemExit("expected STRING_DECL_RE not found")
          text = text.replace(old, new, 1)
          parser.write_text(text, encoding="utf-8")
          PY
          python3 -m py_compile chromeflags.py

      - name: Run unit tests
        run: python3 -m unittest -v test_chromeflags.py

      - name: Verify Chromium flag strings
        run: |
          python3 - <<'PY'
          import chromeflags
          version = "153.0.8010.12"
          checks = (
              ("components/enterprise/net/core/flag_descriptions.cc", "kEnableDynamicRouteFetchingName"),
              ("components/enterprise/net/core/flag_descriptions.cc", "kEnableDynamicRouteFetchingDescription"),
              ("chrome/browser/flag_descriptions.h", "kAiOverlayDialogName"),
          )
          for path, key in checks:
              text = chromeflags.fetch_chromium(path, version)
              parsed = chromeflags.parse_strings(text)
              assert key in parsed, f"{key} missing from {path}"
              print(f"OK: {path}: {key}")
          merged = chromeflags.load("strings", version, "desktop", {})
          assert "kEnableDynamicRouteFetchingName" in merged
          assert "kEnableDynamicRouteFetchingDescription" in merged
          print(f"OK: merged desktop strings={len(merged)}")
          PY

      - name: Update the reports
        run: |
          TITLE="$(python3 chromeflags.py)"
          echo "## $TITLE" >> "$GITHUB_STEP_SUMMARY"
          git add -A
          if ! git diff --staged --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "fix: harden C++ string declarations"
            git push
          fi
