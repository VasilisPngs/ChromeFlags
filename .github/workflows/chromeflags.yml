name: chromeflags

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chromeflags
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Run unit tests
        run: python3 -m unittest test_chromeflags.py

      - name: Update the reports
        run: |
          TITLE="$(python3 chromeflags.py)"
          echo "## $TITLE" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "flags: $TITLE"
            git push
          fi
