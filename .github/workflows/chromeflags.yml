name: chromeflags

on:
  push:
    branches:
      - main
    paths:
      - "chromeflags.py"
      - "test_chromeflags.py"
      - ".github/workflows/chromeflags.yml"
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chromeflags
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Run unit tests
        if: github.event_name != 'schedule'
        run: python3 -m unittest -v test_chromeflags.py

      - name: Update the reports
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          FLAGS_ARG=""
          if [ "${{ github.event_name }}" = "push" ] && git diff --name-only "${{ github.event.before }}" HEAD 2>/dev/null | grep -qx "chromeflags.py"; then
            FLAGS_ARG="--force"
          fi
          TITLE="$(python3 chromeflags.py $FLAGS_ARG)"
          echo "## $TITLE" >> "$GITHUB_STEP_SUMMARY"
          git add -A
          if git diff --staged --quiet; then
            exit 0
          fi
          git commit -m "flags: $TITLE"
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
          done
          echo "Unable to push generated reports after 3 attempts" >&2
          exit 1
