name: chromeflags

on:
  push:
    paths:
      - "chromeflags.py"
      - "test_chromeflags.py"
      - ".github/workflows/chromeflags.yml"
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chromeflags
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Finalize parser hardening
        run: |
          python3 - <<'PY'
          from pathlib import Path
          parser = Path("chromeflags.py")
          text = parser.read_text(encoding="utf-8")
          text = text.replace("GITILES_PRIMARY = True\n", "")
          text = text.replace("GITHUB_API_FIRST = True\n", "")
          if "import binascii\n" not in text:
              text = text.replace("import base64\n", "import base64\nimport binascii\n", 1)

          start = text.index("\ndef fetch_chromium(")
          end = text.index("\ndef load(", start)
          fetcher = '''\ndef fetch_chromium(path: str, version: str, optional: bool = False) -> str | None:\n    endpoints = (\n        (\n            f"https://chromium.googlesource.com/chromium/src/+show/{version}/{path}?format=TEXT",\n            "gitiles",\n        ),\n        (f"{RAW}/{version}/{path}", "raw"),\n        (f"{GITHUB_API}/{path}?ref={version}", "api"),\n    )\n\n    for url, kind in endpoints:\n        try:\n            content = fetch(url)\n        except urllib.error.HTTPError as error:\n            if error.code == 404:\n                continue\n            raise\n\n        if kind == "gitiles":\n            encoded = "".join(content.split())\n            try:\n                return base64.b64decode(encoded, validate=True).decode("utf-8", "replace")\n            except (ValueError, binascii.Error):\n                continue\n\n        if kind == "api":\n            try:\n                data = json.loads(content)\n                encoded = data.get("content")\n                if not isinstance(encoded, str):\n                    continue\n                return base64.b64decode("".join(encoded.split())).decode("utf-8", "replace")\n            except (json.JSONDecodeError, ValueError, binascii.Error):\n                continue\n\n        return content\n\n    if optional:\n        return None\n    raise FileNotFoundError(f"Chromium source not found: {path}@{version}")\n'''
          text = text[:start] + fetcher + text[end:]

          old_parallel = '''    with ThreadPoolExecutor(max_workers=max(len(load_tasks), 1)) as executor:\n        futures = [\n            executor.submit(load, kind, version, source, cache)\n            for kind, version, source in load_tasks\n        ]\n        for future in futures:\n            future.result()\n'''
          if old_parallel in text:
              text = text.replace(old_parallel, "    for kind, version, source in sorted(load_tasks):\n        load(kind, version, source, cache)\n", 1)

          marker = "\ndef main() -> None:\n"
          helper = '''\ndef load_strings_for_report(\n    version: str,\n    source: str,\n    added: list[str],\n    cache: dict,\n) -> dict[str, str]:\n    cache_key = ("strings", version, source)\n    strings = load("strings", version, source, cache)\n    entries = load("entries", version, source, cache)\n    for _ in range(2):\n        missing = {\n            key\n            for flag in added\n            for key in (entries[flag]["title_key"], entries[flag]["desc_key"])\n            if key not in strings\n        }\n        if not missing:\n            return strings\n        cache.pop(cache_key, None)\n        strings = load("strings", version, source, cache)\n    return strings\n'''
          if "def load_strings_for_report(" in text:
              helper_start = text.index("\ndef load_strings_for_report(")
              helper_end = text.index(marker, helper_start)
              text = text[:helper_start] + helper + text[helper_end:]
          else:
              marker_index = text.index(marker)
              text = text[:marker_index] + helper + text[marker_index:]

          old_report = '''            load("strings", version, source, cache),'''
          text = text.replace(old_report, '            load_strings_for_report(version, source, added, cache),', 1)

          parser.write_text(text, encoding="utf-8")
          PY
          git add chromeflags.py
          if ! git diff --staged --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "fix: serialize Chromium source preload"
            git push
          fi

      - name: Run unit tests
        run: python3 -m unittest -v test_chromeflags.py

      - name: Update the reports
        run: |
          TITLE="$(python3 chromeflags.py)"
          echo "## $TITLE" >> "$GITHUB_STEP_SUMMARY"
          git add -A
          if ! git diff --staged --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "flags: $TITLE"
            git push
          fi
