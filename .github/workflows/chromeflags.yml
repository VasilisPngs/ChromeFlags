name: chromeflags

on:
  push:
    paths:
      - "chromeflags.py"
      - "test_chromeflags.py"
      - ".github/workflows/chromeflags.yml"
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chromeflags
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Syntax check
        run: python3 -m py_compile chromeflags.py

      - name: Run unit tests
        run: python3 -m unittest -v test_chromeflags.py

      - name: Update the reports
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            TITLE="$(python3 chromeflags.py)"
            echo "## $TITLE" >> "$GITHUB_STEP_SUMMARY"
            git add -A
            if git diff --staged --quiet; then
              exit 0
            fi
            git commit -m "flags: $TITLE"
            if git push; then
              exit 0
            fi
            git reset --hard origin/main
          done
          echo "Unable to push generated reports after 3 attempts" >&2
          exit 1
