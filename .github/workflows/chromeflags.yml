name: chromeflags

on:
  push:
    paths:
      - "chromeflags.py"
      - "test_chromeflags.py"
      - ".github/workflows/chromeflags.yml"
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chromeflags
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Syntax check
        run: python3 -m py_compile chromeflags.py

      - name: Run unit tests
        run: python3 -m unittest -v test_chromeflags.py

      - name: Verify Chromium flag strings
        run: |
          python3 - <<'PY'
          import chromeflags
          version = "153.0.8010.12"
          cases = [
              ("components/enterprise/net/core/flag_descriptions.cc", "kEnableDynamicRouteFetchingName"),
              ("chrome/browser/flag_descriptions.h", "kAiOverlayDialogName"),
          ]
          for path, key in cases:
              text = chromeflags.fetch_chromium(path, version)
              parsed = chromeflags.parse_strings(text)
              assert key in parsed, f"{key} missing from {path}"
              print(f"OK: {path}: {key}={parsed[key]!r}")
          strings = chromeflags.load("strings", version, "desktop", {})
          assert "kEnableDynamicRouteFetchingName" in strings
          assert "kEnableDynamicRouteFetchingDescription" in strings
          print(f"OK: merged desktop strings={len(strings)}")
          PY

      - name: Update the reports
        run: |
          TITLE="$(python3 chromeflags.py)"
          echo "## $TITLE" >> "$GITHUB_STEP_SUMMARY"
          git add -A
          if ! git diff --staged --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "flags: $TITLE"
            git push
          fi
