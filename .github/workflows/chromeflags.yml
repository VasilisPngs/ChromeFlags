name: chromeflags

on:
  push:
    paths:
      - "chromeflags.py"
      - "test_chromeflags.py"
      - ".github/workflows/chromeflags.yml"
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chromeflags
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Repair Chromium source retrieval
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          parser = Path("chromeflags.py")
          text = parser.read_text(encoding="utf-8")
          if "GITHUB_API = \"https://api.github.com/repos/chromium/chromium/contents\"" not in text:
              text = text.replace(
                  'import gzip\n',
                  'import base64\nimport gzip\n',
                  1,
              )
              text = text.replace(
                  'RAW = "https://raw.githubusercontent.com/chromium/chromium"\n',
                  'RAW = "https://raw.githubusercontent.com/chromium/chromium"\nGITHUB_API = "https://api.github.com/repos/chromium/chromium/contents"\n',
                  1,
              )
              start = text.index('\ndef load(kind: str, version: str, source: str, cache: dict) -> dict:')
              end = text.index('\ndef number(', start)
              replacement = '''\ndef fetch_chromium(path: str, version: str, optional: bool = False) -> str | None:\n    raw_url = f"{RAW}/{version}/{path}"\n    try:\n        text = fetch(raw_url, optional=True)\n        if text is not None:\n            return text\n    except urllib.error.HTTPError as error:\n        if error.code != 404:\n            raise\n\n    api_url = f"{GITHUB_API}/{path}?ref={version}"\n    try:\n        content = fetch(api_url, optional=True)\n        if content is not None:\n            data = json.loads(content)\n            encoded = data.get("content")\n            if not isinstance(encoded, str):\n                raise ValueError(f"missing base64 content for Chromium source {path}@{version}")\n            return base64.b64decode(encoded).decode("utf-8", "replace")\n    except urllib.error.HTTPError as error:\n        if error.code != 404:\n            raise\n\n    if optional:\n        return None\n    raise FileNotFoundError(f"Chromium source not found: {path}@{version}")\n\n\ndef load(kind: str, version: str, source: str, cache: dict) -> dict:\n    key = (kind, version, source)\n    if key in cache:\n        return cache[key]\n\n    if source not in SOURCES:\n        raise ValueError(f"unknown source group: {source}")\n\n    if kind == "entries":\n        path = SOURCES[source]["entries"]\n        result = parse_entries(fetch_chromium(path, version))\n    elif kind == "strings":\n        result = {}\n        for path, optional in SOURCES[source]["strings"]:\n            text = fetch_chromium(path, version, optional)\n            if text is not None:\n                result.update(parse_strings(text))\n    else:\n        raise ValueError(f"unknown data kind: {kind}")\n\n    cache[key] = result\n    return result\n'''
              text = text[:start] + replacement + text[end:]
              parser.write_text(text, encoding="utf-8")
          workflow = Path(".github/workflows/chromeflags.yml")
          workflow_text = workflow.read_text(encoding="utf-8")
          workflow_text = re.sub(
              r'\n      - name: Repair Chromium source retrieval\n.*?(?=\n      - name: Run unit tests)',
              '',
              workflow_text,
              flags=re.S,
          )
          workflow.write_text(workflow_text, encoding="utf-8")
          PY
          git add chromeflags.py .github/workflows/chromeflags.yml
          if ! git diff --staged --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "fix: add Chromium source fallback"
            git push
          fi

      - name: Run unit tests
        run: python3 -m unittest -v test_chromeflags.py

      - name: Update the reports
        run: |
          TITLE="$(python3 chromeflags.py)"
          echo "## $TITLE" >> "$GITHUB_STEP_SUMMARY"
          git add -A
          if ! git diff --staged --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "flags: $TITLE"
            git push
          fi
